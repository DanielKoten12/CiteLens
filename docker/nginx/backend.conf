# Edge for the Laravel API (dev: nginx container + bind-mounted public/;
# prod: baked into the `web` image by docker/nginx/Dockerfile).
#
# The only document root is Laravel's public/ directory; php-fpm receives every
# non-static request (`docs/ARCHITECTURE.md` §12).

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Docker's embedded DNS. Re-resolve the php-fpm service so recreating the
    # `backend` container (new IP) does not leave this edge pointing at a stale
    # address until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Above the 20 MB API cap so Laravel returns the documented 413 envelope
    # instead of nginx's own HTML error page (docs/API_SPEC.md §9).
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        set $backend_fpm backend:9000;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
