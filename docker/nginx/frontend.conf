# Edge for the production SPA (baked into the frontend image by
# frontend/Dockerfile). Serves the built Vite bundle and proxies `/api/` to the
# Laravel edge so the browser stays same-origin (no CORS round trips).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Re-resolve the Laravel edge so recreating the `web`
    # container (new IP) does not leave the /api proxy pointing at a stale
    # address until this container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Matches the 20 MB API cap; Laravel still answers with the 413 envelope.
    client_max_body_size 25m;

    location /api/ {
        # No URI part: the original path (/api/v1/...) is forwarded unchanged.
        set $api_upstream web:80;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Vue Router history mode: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
