; Container overrides for the Laravel API.
;
; The public upload cap is 20 MB (`docs/API_SPEC.md` §9). PHP (and nginx, see
; docker/nginx/backend.conf) must accept a little more than that so the request
; reaches Laravel validation and the documented 413 envelope is returned instead
; of a PHP/nginx HTML error page.

upload_max_filesize = 25M
post_max_size = 26M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

expose_php = Off
