  /documents/{document}/reports:
    post:
      tags: [Reports]
      operationId: createReport
      summary: Generate report
      description: |
        Creates a report row (`status = pending`) and dispatches asynchronous PDF
        generation. Allowed only when the document `status = completed`; anything
        else returns `409 CONFLICT`. Reports are PDF only (no DOCX/Excel in v1);
        a failed report is regenerated by calling this endpoint again.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '202':
          description: Report queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    required: [data, message]
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportSummary'
              examples:
                success:
                  value:
                    data:
                      id: 92a3b4c5-d6e7-4a93-8e7f-8091a2b3c4d5
                      document_id: b2d4e6f8-1234-4abc-9def-0123456789ab
                      status: pending
                      download_url: null
                      generated_at: null
                    message: Laporan sedang dibuat.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '409':
          $ref: '#/components/responses/ConflictReportNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Reports]
      operationId: listReports
      summary: List reports
      description: |
        Paginated report history for one document, ordered by `created_at`
        descending. `download_url` is `null` until the report is `completed`,
        then a temporary URL for the file on the private report disk.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated report list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReportSummary'
              examples:
                success:
                  value:
                    data:
                      - id: 92a3b4c5-d6e7-4a93-8e7f-8091a2b3c4d5
                        document_id: b2d4e6f8-1234-4abc-9def-0123456789ab
                        status: completed
                        download_url: https://api.dafpus.example/storage/reports/92a3b4c5-d6e7-4a93-8e7f-8091a2b3c4d5.pdf
                        generated_at: "2026-09-23T15:45:00Z"
                    meta:
                      current_page: 1
                      per_page: 15
                      total: 1
                      last_page: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /reports/{report}:
    get:
      tags: [Reports]
      operationId: showReport
      summary: Report detail
      description: |
        `download_url` is `null` until the report is `completed`; `error` carries
        a safe message only when the report is `failed`.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportDetail'
              examples:
                success:
                  value:
                    data:
                      id: 92a3b4c5-d6e7-4a93-8e7f-8091a2b3c4d5
                      document_id: b2d4e6f8-1234-4abc-9def-0123456789ab
                      status: completed
                      download_url: https://api.dafpus.example/storage/reports/92a3b4c5-d6e7-4a93-8e7f-8091a2b3c4d5.pdf
                      error: null
                      generated_at: "2026-09-23T15:45:00Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ReportNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Reports]
      operationId: deleteReport
      summary: Delete report
      description: Hard-deletes the report row, its `files` row and the stored file.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '204':
          description: Report deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ReportNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: |
        `Authorization: Bearer <token>` where `<token>` is a personal access token
        issued by `POST /auth/register` or `POST /auth/login`.

  parameters:
    DocumentId:
      name: document
      in: path
      required: true
      description: Document UUID. A value that is not a UUID never matches a route and returns `404`.
      schema:
        type: string
        format: uuid
    ReferenceId:
      name: reference
      in: path
      required: true
      description: Reference UUID. A value that is not a UUID never matches a route and returns `404`.
      schema:
        type: string
        format: uuid
    CitationId:
      name: citation
      in: path
      required: true
      description: Citation UUID. A value that is not a UUID never matches a route and returns `404`.
      schema:
        type: string
        format: uuid
    ReportId:
      name: report
      in: path
      required: true
      description: Report UUID. A value that is not a UUID never matches a route and returns `404`.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Items per page. Default 15, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15

  schemas:
    # --- Enums ---------------------------------------------------------------
    DocumentStatus:
      type: string
      description: Lifecycle of an uploaded document.
      enum: [pending, processing, completed, failed]
    AnalysisStep:
      type: string
      description: Ordered pipeline step of the document analysis.
      enum:
        - queued
        - extracting
        - persisting
        - crossref_validation
        - embedding
        - scoring
        - resolving_citations
        - generating_report
        - completed
    NullableAnalysisStep:
      description: The current analysis step, or `null` before one is recorded.
      oneOf:
        - $ref: '#/components/schemas/AnalysisStep'
        - type: 'null'
    ReferenceFindingStatus:
      type: string
      description: Verification verdict stored per bibliography reference.
      enum: [pending, valid, suspicious, invalid, not_found]
    CitationStatus:
      type: string
      description: |
        Derived citation status — never persisted. Recomputed from the resolution
        state and the paired reference finding, so a manual review immediately
        changes the status of every citation pointing to that reference.
      enum: [valid, unreliable, pending, unresolved, hallucination]
    CitationResolutionState:
      type: string
      description: Persisted pairing state that drives the derived citation status.
      enum: [paired, unresolved, unmatched]
    CitationResolutionMethod:
      type: string
      description: Signal that produced the pairing.
      enum: [extraction_hint, apa, ieee, manual]
    NullableCitationResolutionMethod:
      description: The resolution method, or `null` when unknown / not yet resolved.
      oneOf:
        - $ref: '#/components/schemas/CitationResolutionMethod'
        - type: 'null'
    ReportStatus:
      type: string
      enum: [pending, processing, completed, failed]
    FindingType:
      type: string
      enum:
        - reference_invalid
        - reference_suspicious
        - reference_not_found
        - reference_pending
        - citation_unreliable
        - citation_unresolved
        - citation_hallucination
    FindingSeverity:
      type: string
      enum: [high, medium, low, info]
    ErrorCode:
      type: string
      description: Canonical machine-readable error code.
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_ERROR
        - RATE_LIMITED
        - SERVER_ERROR
        - INFERENCE_UNAVAILABLE

    # --- Envelopes -----------------------------------------------------------
    SingleResponse:
      type: object
      description: Canonical single-resource / action envelope.
      required: [data]
      properties:
        data: {}
        message:
          type: string
          description: Human-readable note; only present on actions.
    CollectionResponse:
      type: object
      description: Canonical paginated collection envelope.
      required: [data, meta]
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        last_page: {type: integer, minimum: 1}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Safe, human-readable message. Internal exception details are never echoed.
            details:
              type: object
              description: |
                Optional machine-readable details, keyed by field name. For
                `VALIDATION_ERROR` each value is a list of messages; domain
                failures (invalid candidate, foreign reference id, …) use the
                same shape.
              additionalProperties:
                type: array
                items:
                  type: string

    # --- Auth ----------------------------------------------------------------
    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 255}
        email: {type: string, format: email, maxLength: 255}
        created_at: {type: [string, 'null'], format: date-time}
    Authentication:
      type: object
      required: [user, token, token_type]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Sanctum personal access token, e.g. `1|eyJhbGciOi…`.
        token_type:
          type: string
          enum: [Bearer]
          default: Bearer
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: {type: string, maxLength: 255}
        email: {type: string, format: email, maxLength: 255}
        password: {type: string, minLength: 8}
        password_confirmation: {type: string, minLength: 8}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}

    # --- Documents -----------------------------------------------------------
    UploadDocumentRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          contentMediaType: application/pdf
          description: PDF only (DOCX unsupported in v1), maximum 20 MB.
        name:
          type: string
          maxLength: 255
          description: Defaults to the original filename.
    DocumentAnalysisSummary:
      type: object
      description: Derived analysis counts for one document.
      required:
        - total_references
        - valid
        - suspicious
        - invalid
        - not_found
        - total_citations
        - valid_citations
        - unreliable_citations
        - pending_citations
        - unresolved_citations
        - hallucination_citations
      properties:
        total_references: {type: integer, minimum: 0}
        valid: {type: integer, minimum: 0}
        suspicious: {type: integer, minimum: 0}
        invalid: {type: integer, minimum: 0}
        not_found: {type: integer, minimum: 0}
        total_citations: {type: integer, minimum: 0}
        valid_citations: {type: integer, minimum: 0}
        unreliable_citations: {type: integer, minimum: 0}
        pending_citations: {type: integer, minimum: 0}
        unresolved_citations: {type: integer, minimum: 0}
        hallucination_citations: {type: integer, minimum: 0}
    FilePreview:
      type: object
      required: [filename, mime_type, size, url]
      properties:
        filename: {type: string}
        mime_type: {type: [string, 'null']}
        size: {type: [integer, 'null'], format: int64, minimum: 0}
        url: {type: [string, 'null'], format: uri-reference}
    DocumentSummary:
      type: object
      description: A document list item.
      required: [id, name, status, progress, summary, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status:
          $ref: '#/components/schemas/DocumentStatus'
        progress: {type: integer, minimum: 0, maximum: 100}
        summary:
          description: Derived counts; `null` until the analysis has completed.
          oneOf:
            - $ref: '#/components/schemas/DocumentAnalysisSummary'
            - type: 'null'
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    DocumentDetail:
      type: object
      description: Full document representation (upload response and detail).
      required:
        - id
        - name
        - status
        - progress
        - current_step
        - error
        - file
        - summary
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status:
          $ref: '#/components/schemas/DocumentStatus'
        progress: {type: integer, minimum: 0, maximum: 100}
        current_step:
          $ref: '#/components/schemas/NullableAnalysisStep'
        error:
          type: [string, 'null']
          description: Failure message; only set when `status = failed`.
        file:
          oneOf:
            - $ref: '#/components/schemas/FilePreview'
            - type: 'null'
        summary:
          description: Derived counts; `null` until the analysis has completed.
          oneOf:
            - $ref: '#/components/schemas/DocumentAnalysisSummary'
            - type: 'null'
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    DocumentStatusInfo:
      type: object
      description: Lightweight polling payload (progress polling and retry).
      required: [id, status, progress, current_step, error, updated_at]
      properties:
        id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/DocumentStatus'
        progress: {type: integer, minimum: 0, maximum: 100}
        current_step:
          $ref: '#/components/schemas/NullableAnalysisStep'
        error: {type: [string, 'null']}
        updated_at: {type: [string, 'null'], format: date-time}

    # --- References ----------------------------------------------------------
    Location:
      type: object
      description: |
        A highlight location: 1-based page plus a bounding box in PDF page
        coordinates (`coordinate_system: pdf_points_top_left`). Values feed the
        document viewer verbatim.
      required:
        - page_number
        - x
        - y
        - width
        - height
        - page_width
        - page_height
        - coordinate_system
        - location_index
      properties:
        page_number: {type: integer, minimum: 1}
        x: {type: number, format: float}
        y: {type: number, format: float}
        width: {type: number, format: float}
        height: {type: number, format: float}
        page_width: {type: [number, 'null'], format: float}
        page_height: {type: [number, 'null'], format: float}
        coordinate_system: {type: string, enum: [pdf_points_top_left]}
        location_index: {type: integer, minimum: 0}
    ReferenceFindingPreview:
      type: object
      description: Finding preview embedded in a reference list item.
      required: [id, status, confidence, reason, selected_candidate_id]
      properties:
        id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/ReferenceFindingStatus'
        confidence: {type: [number, 'null'], format: float, minimum: 0, maximum: 1}
        reason: {type: [string, 'null']}
        selected_candidate_id: {type: [string, 'null'], format: uuid}
    ReferenceFindingCandidate:
      type: object
      description: One ranked Crossref candidate of a reference finding.
      required: [id, rank, confidence, doi, title, authors, publication_name, publication_year, url, match_reason]
      properties:
        id: {type: string, format: uuid}
        rank: {type: integer, minimum: 1}
        confidence: {type: number, format: float, minimum: 0, maximum: 1}
        doi: {type: [string, 'null']}
        title: {type: [string, 'null']}
        authors: {type: [string, 'null']}
        publication_name: {type: [string, 'null']}
        publication_year: {type: [integer, 'null']}
        url: {type: [string, 'null'], format: uri-reference}
        match_reason: {type: [string, 'null']}
    ReferenceFindingDetail:
      type: object
      description: Full finding of a reference detail response, with audit fields and candidates.
      required: [id, status, confidence, reason, selected_candidate_id, is_manual, reviewed_by, reviewed_at, candidates]
      properties:
        id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/ReferenceFindingStatus'
        confidence: {type: [number, 'null'], format: float, minimum: 0, maximum: 1}
        reason: {type: [string, 'null']}
        selected_candidate_id: {type: [string, 'null'], format: uuid}
        is_manual: {type: boolean}
        reviewed_by: {type: [string, 'null'], format: uuid}
        reviewed_at: {type: [string, 'null'], format: date-time}
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceFindingCandidate'
    ReferenceFindingReview:
      type: object
      description: Response of a manual finding review, with audit fields.
      required: [id, status, confidence, reason, selected_candidate_id, is_manual, reviewed_by, reviewed_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/ReferenceFindingStatus'
        confidence: {type: [number, 'null'], format: float, minimum: 0, maximum: 1}
        reason: {type: [string, 'null']}
        selected_candidate_id: {type: [string, 'null'], format: uuid}
        is_manual: {type: boolean}
        reviewed_by: {type: [string, 'null'], format: uuid}
        reviewed_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    UpdateReferenceFindingRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Manual verdict. `pending` is not allowed.
          enum: [valid, suspicious, invalid, not_found]
        selected_candidate_id:
          type: [string, 'null']
          format: uuid
          description: Must belong to this finding.
        reason:
          type: [string, 'null']
          maxLength: 2000
    ReferenceSummary:
      type: object
      description: A bibliography list item with its finding preview.
      required: [id, raw_text, doi, title, authors, publication_name, publication_year, text_start_offset, text_end_offset, finding]
      properties:
        id: {type: string, format: uuid}
        raw_text: {type: [string, 'null']}
        doi: {type: [string, 'null']}
        title: {type: [string, 'null']}
        authors: {type: [string, 'null']}
        publication_name: {type: [string, 'null']}
        publication_year: {type: [integer, 'null']}
        text_start_offset: {type: [integer, 'null']}
        text_end_offset: {type: [integer, 'null']}
        finding:
          oneOf:
            - $ref: '#/components/schemas/ReferenceFindingPreview'
            - type: 'null'
    ReferenceDetail:
      type: object
      description: Full reference detail with locations, finding/candidates and resolved citations.
      required:
        - id
        - raw_text
        - doi
        - title
        - authors
        - publication_name
        - publication_year
        - text_start_offset
        - text_end_offset
        - locations
        - finding
        - citations
      properties:
        id: {type: string, format: uuid}
        raw_text: {type: [string, 'null']}
        doi: {type: [string, 'null']}
        title: {type: [string, 'null']}
        authors: {type: [string, 'null']}
        publication_name: {type: [string, 'null']}
        publication_year: {type: [integer, 'null']}
        text_start_offset: {type: [integer, 'null']}
        text_end_offset: {type: [integer, 'null']}
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        finding:
          oneOf:
            - $ref: '#/components/schemas/ReferenceFindingDetail'
            - type: 'null'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CitationOccurrence'

    # --- Citations -----------------------------------------------------------
    CitationReferencePreview:
      type: object
      description: Minimal preview of the reference a citation is paired with.
      required: [id, title]
      properties:
        id: {type: string, format: uuid}
        title: {type: [string, 'null']}
    CitationOccurrence:
      type: object
      description: A citation occurrence embedded in the reference detail response.
      required: [id, citation_text, occurrence_index]
      properties:
        id: {type: string, format: uuid}
        citation_text: {type: string}
        occurrence_index: {type: [integer, 'null']}
    CitationResolution:
      type: object
      description: |
        Resolution provenance. `state` drives the derived status;
        `method`/`confidence`/`hint_index` explain how the pairing was produced.
      required: [state, method, confidence, hint_index]
      properties:
        state:
          $ref: '#/components/schemas/CitationResolutionState'
        method:
          $ref: '#/components/schemas/NullableCitationResolutionMethod'
        confidence: {type: [number, 'null'], format: float, minimum: 0, maximum: 1}
        hint_index:
          type: [integer, 'null']
          description: Raw GROBID `reference_index` when present (audit only).
    CitationResolutionCandidate:
      type: object
      description: One ranked alternative reference for a citation.
      required: [id, rank, confidence, method, match_reason, reference]
      properties:
        id: {type: string, format: uuid}
        rank: {type: integer, minimum: 1}
        confidence: {type: number, format: float, minimum: 0, maximum: 1}
        method:
          $ref: '#/components/schemas/CitationResolutionMethod'
        match_reason: {type: [string, 'null']}
        reference:
          oneOf:
            - $ref: '#/components/schemas/CitationReferencePreview'
            - type: 'null'
    CitationSummary:
      type: object
      description: A citation list item with its derived status.
      required:
        - id
        - citation_text
        - citation_marker
        - context_before
        - context_after
        - text_start_offset
        - text_end_offset
        - occurrence_index
        - status
        - resolution_method
        - reference
      properties:
        id: {type: string, format: uuid}
        citation_text: {type: string}
        citation_marker: {type: [string, 'null']}
        context_before: {type: [string, 'null']}
        context_after: {type: [string, 'null']}
        text_start_offset: {type: [integer, 'null']}
        text_end_offset: {type: [integer, 'null']}
        occurrence_index: {type: [integer, 'null']}
        status:
          $ref: '#/components/schemas/CitationStatus'
        resolution_method:
          $ref: '#/components/schemas/NullableCitationResolutionMethod'
        reference:
          oneOf:
            - $ref: '#/components/schemas/CitationReferencePreview'
            - type: 'null'
    CitationDetail:
      type: object
      description: Full citation detail (list fields plus resolution, locations and candidates).
      required:
        - id
        - citation_text
        - citation_marker
        - context_before
        - context_after
        - text_start_offset
        - text_end_offset
        - occurrence_index
        - status
        - resolution_method
        - reference
        - resolution
        - candidates
        - locations
      properties:
        id: {type: string, format: uuid}
        citation_text: {type: string}
        citation_marker: {type: [string, 'null']}
        context_before: {type: [string, 'null']}
        context_after: {type: [string, 'null']}
        text_start_offset: {type: [integer, 'null']}
        text_end_offset: {type: [integer, 'null']}
        occurrence_index: {type: [integer, 'null']}
        status:
          $ref: '#/components/schemas/CitationStatus'
        resolution_method:
          $ref: '#/components/schemas/NullableCitationResolutionMethod'
        reference:
          oneOf:
            - $ref: '#/components/schemas/CitationReferencePreview'
            - type: 'null'
        resolution:
          $ref: '#/components/schemas/CitationResolution'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CitationResolutionCandidate'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
    CitationPairing:
      type: object
      description: Response of a manual pairing/unpairing with the freshly derived status.
      required: [id, status, resolution_method, reference]
      properties:
        id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/CitationStatus'
        resolution_method:
          $ref: '#/components/schemas/NullableCitationResolutionMethod'
        reference:
          oneOf:
            - $ref: '#/components/schemas/CitationReferencePreview'
            - type: 'null'
    UpdateCitationRequest:
      type: object
      description: |
        The field must be present: an explicit `null` clears the pairing, a UUID
        pairs the citation with a reference of the same document.
      required: [researched_document_reference_id]
      properties:
        researched_document_reference_id:
          type: [string, 'null']
          format: uuid

    # --- Findings ------------------------------------------------------------
    FindingHighlight:
      type: object
      description: One derived item of the findings/highlights feed.
      required: [id, type, severity, message, reference_id, citation_id, text, start_offset, end_offset, locations]
      properties:
        id:
          type: string
          pattern: '^(ref-finding|citation):[0-9a-fA-F-]{36}$'
          description: |
            Synthetic identifier: `ref-finding:{findingId}` for reference
            findings, `citation:{citationId}` for citation findings.
        type:
          $ref: '#/components/schemas/FindingType'
        severity:
          $ref: '#/components/schemas/FindingSeverity'
        message: {type: [string, 'null']}
        reference_id: {type: [string, 'null'], format: uuid}
        citation_id: {type: [string, 'null'], format: uuid}
        text: {type: [string, 'null']}
        start_offset: {type: [integer, 'null']}
        end_offset: {type: [integer, 'null']}
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'

    # --- Reports -------------------------------------------------------------
    ReportSummary:
      type: object
      description: A report list item / action response.
      required: [id, document_id, status, download_url, generated_at]
      properties:
        id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/ReportStatus'
        download_url:
          type: [string, 'null']
          format: uri-reference
          description: Temporary URL for the stored PDF; `null` until the report is `completed`.
        generated_at: {type: [string, 'null'], format: date-time}
    ReportDetail:
      type: object
      description: Full report detail.
      required: [id, document_id, status, download_url, error, generated_at]
      properties:
        id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/ReportStatus'
        download_url:
          type: [string, 'null']
          format: uri-reference
          description: Temporary URL for the stored PDF; `null` until the report is `completed`.
        error:
          type: [string, 'null']
          description: Safe failure message; only set when `status = failed`.
        generated_at: {type: [string, 'null'], format: date-time}

  responses:
    Unauthenticated:
      description: Missing, expired or invalid bearer token (`401 UNAUTHENTICATED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Unauthenticated.
    DocumentNotFound:
      description: Unknown document id **or** document not owned by the caller (`404 NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: Dokumen tidak ditemukan.
    ReferenceNotFound:
      description: Unknown reference id **or** reference not owned by the caller (`404 NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: Referensi tidak ditemukan.
    CitationNotFound:
      description: Unknown citation id **or** citation not owned by the caller (`404 NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: Sitasi tidak ditemukan.
    ReportNotFound:
      description: Unknown report id **or** report not owned by the caller (`404 NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: Laporan tidak ditemukan.
    ValidationError:
      description: Field validation failed (`422 VALIDATION_ERROR`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            generic:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: The given data was invalid.
                  details:
                    email:
                      - The email field is required.
            invalidCandidate:
              summary: A selected candidate that does not belong to the finding.
              value:
                error:
                  code: VALIDATION_ERROR
                  message: The given data was invalid.
                  details:
                    selected_candidate_id:
                      - Kandidat yang dipilih tidak valid untuk temuan ini.
            invalidReferenceFilter:
              summary: A `reference_id` filter that is not part of the document.
              value:
                error:
                  code: VALIDATION_ERROR
                  message: The given data was invalid.
                  details:
                    reference_id:
                      - The selected reference is invalid for this document.
            invalidPairingReference:
              summary: A pairing target that is not part of the document.
              value:
                error:
                  code: VALIDATION_ERROR
                  message: The given data was invalid.
                  details:
                    researched_document_reference_id:
                      - The selected reference is invalid for this document.
    InvalidCredentials:
      description: |
        Invalid credentials (`422 VALIDATION_ERROR`). An unknown email and a wrong
        password produce the same response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Kredensial tidak valid.
                  details:
                    email:
                      - These credentials do not match our records.
    ConflictDocumentRetry:
      description: Retry attempted while the document is not `failed` (`409 CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              value:
                error:
                  code: CONFLICT
                  message: Analisis hanya dapat diulang untuk dokumen yang gagal.
    ConflictReportNotAllowed:
      description: Report requested while the document is not `completed` (`409 CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              value:
                error:
                  code: CONFLICT
                  message: Laporan hanya dapat dibuat untuk dokumen yang selesai dianalisis.
    ConflictFindingReview:
      description: Finding review attempted while the document is `processing` (`409 CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              value:
                error:
                  code: CONFLICT
                  message: Status referensi tidak dapat diubah saat analisis sedang berjalan.
    PayloadTooLarge:
      description: Uploaded file exceeds 20 MB (`413 PAYLOAD_TOO_LARGE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            payloadTooLarge:
              value:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Ukuran file melebihi batas 20 MB.
                  details:
                    file:
                      - Ukuran file melebihi batas 20 MB.
    UnsupportedMediaType:
      description: Uploaded file is not a PDF (`415 UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unsupportedMediaType:
              value:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: Format file tidak didukung. Hanya PDF yang diterima.
                  details:
                    file:
                      - Format file tidak didukung. Hanya PDF yang diterima.
    RateLimited:
      description: Rate limit exceeded (`429 RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds until the rate-limit window resets.
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Limit:
          description: Maximum number of requests allowed in the window.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Requests remaining in the current window (always `0` when limited).
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: Too many attempts. Please try again later.
    ServerError:
      description: Unhandled server error (`500 SERVER_ERROR`). Internals are never disclosed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                error:
                  code: SERVER_ERROR
                  message: Terjadi kesalahan pada server.
    InferenceUnavailable:
      description: |
        Internal inference service (GROBID/SBERT) unreachable or analysis failed
        (`503 INFERENCE_UNAVAILABLE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            inferenceUnavailable:
              value:
                error:
                  code: INFERENCE_UNAVAILABLE
                  message: Layanan analisis tidak tersedia. Coba lagi nanti.
