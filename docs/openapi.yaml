openapi: 3.1.0

info:
  title: Dafpus Cek API
  version: 1.0.0
  summary: Academic-reference verification API (public contract)
  description: |
    Public REST contract for **Dafpus Cek** (frontend brand: *CiteLens*), the
    academic-reference verification application.

    The canonical source of truth is `docs/API_SPEC.md`; this document mirrors it
    and the Laravel implementation. The internal FastAPI/GROBID/SBERT inference
    service is **not** part of this contract and is deliberately not described
    here.

    ## Conventions

    - **Base path** `/api/v1`. Clients should send `Accept: application/json`.
    - **Authentication** Laravel Sanctum personal access tokens:
      `Authorization: Bearer <token>`. Only `POST /auth/register` and
      `POST /auth/login` are public.
    - **IDs** are UUID v4 strings.
    - **Timestamps** are ISO 8601 UTC, e.g. `2026-09-23T15:30:00Z`.
    - **Confidence** is a decimal between `0.0000` and `1.0000`.
    - **Enums** are `lower_snake_case`.
    - **Success envelope** single: `{ "data": …, "message"?: "…" }`; collection:
      `{ "data": [ … ], "meta": { "current_page", "per_page", "total", "last_page" } }`.
      `message` is only present on actions. `204` responses carry no body.
    - **Error envelope** every non-2xx response:
      `{ "error": { "code": "…", "message": "…", "details"?: { … } } }`.
      `403 FORBIDDEN` exists in the canonical error table but document-owned
      resources never use it: foreign resources return `404` (no existence
      disclosure).
    - **Ownership** a resource is accessible only to the owner of its parent
      document. Foreign resources return `404 NOT_FOUND` exactly like missing
      ones — existence is never disclosed.
    - **Deletion** is a hard delete with cascade to dependent rows.
    - **Rate limits** (defaults): auth `5/min/IP`, upload `10/min/user`,
      status polling `120/min/user`, other authenticated endpoints `60/min/user`.
  x-canonical-spec: docs/API_SPEC.md

servers:
  - url: https://api.dafpus.example/api/v1
    description: Production (placeholder host from the API specification)
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Registration, login, logout and the current user.
  - name: Documents
    description: Upload, history, detail, progress polling, retry and deletion.
  - name: References
    description: Bibliography entries, verification findings and manual review.
  - name: Citations
    description: In-text citation occurrences, derived status and manual pairing.
  - name: Findings
    description: Derived read-only findings/highlights feed for the document viewer.
  - name: Reports
    description: On-demand PDF report generation, listing, detail and deletion.

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register + issue token
      description: |
        Creates an account and issues a Sanctum personal access token.
        Rate limit: `5/min/IP`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and token issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    required: [data, message]
                    properties:
                      data:
                        $ref: '#/components/schemas/Authentication'
              examples:
                success:
                  value:
                    data:
                      user:
                        id: 9f1c2b3a-4d5e-4f60-8a91-2b3c4d5e6f70
                        name: Daniel Belawa Koten
                        email: daniel@example.com
                        created_at: "2026-09-23T15:30:00Z"
                      token: "1|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-token"
                      token_type: Bearer
                    message: Registrasi berhasil.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login + issue token
      description: |
        Verifies credentials and issues a Sanctum personal access token. An
        unknown email and a wrong password are indistinguishable.
        Rate limit: `5/min/IP`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Authentication'
              examples:
                success:
                  value:
                    data:
                      user:
                        id: 9f1c2b3a-4d5e-4f60-8a91-2b3c4d5e6f70
                        name: Daniel Belawa Koten
                        email: daniel@example.com
                        created_at: "2026-09-23T15:30:00Z"
                      token: "2|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-token"
                      token_type: Bearer
        '422':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke current token
      responses:
        '200':
          description: Token revoked.
          content:
            application/json:
              schema:
                type: object
                required: [data, message]
                properties:
                  data:
                    type: 'null'
                  message:
                    type: string
              examples:
                success:
                  value:
                    data: null
                    message: Logout berhasil.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: Current user
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
              examples:
                success:
                  value:
                    data:
                      id: 9f1c2b3a-4d5e-4f60-8a91-2b3c4d5e6f70
                      name: Daniel Belawa Koten
                      email: daniel@example.com
                      created_at: "2026-09-23T15:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Document history
      description: |
        Paginated history of the authenticated user's documents. Ordered by
        `created_at` descending unless `sort` is given. `summary` is `null` until
        the analysis of that document has completed.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          required: false
          description: Filter by document status.
          schema:
            $ref: '#/components/schemas/DocumentStatus'
        - name: q
          in: query
          required: false
          description: Case-insensitive search on the document name.
          schema:
            type: string
            maxLength: 255
        - name: sort
          in: query
          required: false
          description: Sort order on `created_at`.
          schema:
            type: string
            enum: [created_at, '-created_at']
            default: '-created_at'
      responses:
        '200':
          description: Paginated document list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DocumentSummary'
              examples:
                success:
                  value:
                    data:
                      - id: b2d4e6f8-1234-4abc-9def-0123456789ab
                        name: laporan-akhir.pdf
                        status: completed
                        progress: 100
                        summary:
                          total_references: 8
                          valid: 5
                          suspicious: 2
                          invalid: 0
                          not_found: 1
                          total_citations: 15
                          valid_citations: 12
                          unreliable_citations: 1
                          pending_citations: 0
                          unresolved_citations: 0
                          hallucination_citations: 2
                        created_at: "2026-09-23T15:30:00Z"
                        updated_at: "2026-09-23T15:31:12Z"
                    meta:
                      current_page: 1
                      per_page: 15
                      total: 42
                      last_page: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Upload + start analysis
      description: |
        Upload **and** analysis start are merged: the document and its file are
        persisted, `AnalyzeDocumentJob` is dispatched to the queue, and the
        endpoint responds immediately with `202`. Analysis runs asynchronously;
        poll `GET /documents/{document}/status`.

        **PDF only** (DOCX is not supported in v1), maximum **20 MB**.
        Rate limit: `10/min/user`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '202':
          description: Document stored and analysis queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    required: [data, message]
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentDetail'
              examples:
                success:
                  value:
                    data:
                      id: b2d4e6f8-1234-4abc-9def-0123456789ab
                      name: laporan-akhir.pdf
                      status: pending
                      progress: 0
                      current_step: queued
                      error: null
                      file:
                        filename: laporan-akhir.pdf
                        mime_type: application/pdf
                        size: 245678
                        url: https://api.dafpus.example/storage/documents/b2d4e6f8-1234-4abc-9def-0123456789ab/laporan-akhir.pdf
                      created_at: "2026-09-23T15:30:00Z"
                      updated_at: "2026-09-23T15:30:00Z"
                      summary: null
                    message: Dokumen berhasil diunggah. Analisis sedang diproses.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/InferenceUnavailable'
    delete:
      tags: [Documents]
      operationId: purgeDocuments
      summary: Purge history
      description: |
        Hard-deletes the authenticated user's entire document history (documents,
        references, citations, locations, findings, candidates, files, reports).
      responses:
        '204':
          description: History purged. No body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /documents/{document}:
    get:
      tags: [Documents]
      operationId: showDocument
      summary: Document detail
      description: |
        Full document detail: the list fields plus `current_step`, `error`,
        `file` and the derived `summary` (present once `status = completed`).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentDetail'
              examples:
                success:
                  value:
                    data:
                      id: b2d4e6f8-1234-4abc-9def-0123456789ab
                      name: laporan-akhir.pdf
                      status: completed
                      progress: 100
                      current_step: completed
                      error: null
                      file:
                        filename: laporan-akhir.pdf
                        mime_type: application/pdf
                        size: 245678
                        url: https://api.dafpus.example/storage/documents/b2d4e6f8-1234-4abc-9def-0123456789ab/laporan-akhir.pdf
                      created_at: "2026-09-23T15:30:00Z"
                      updated_at: "2026-09-23T15:31:12Z"
                      summary:
                        total_references: 8
                        valid: 5
                        suspicious: 2
                        invalid: 0
                        not_found: 1
                        total_citations: 15
                        valid_citations: 12
                        unreliable_citations: 1
                        pending_citations: 0
                        unresolved_citations: 0
                        hallucination_citations: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete one document
      description: Hard-deletes the document and cascades to all dependent rows.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Document deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /documents/{document}/status:
    get:
      tags: [Documents]
      operationId: documentStatus
      summary: Poll analysis progress
      description: |
        Lightweight polling payload. Recommended client interval: every 2 s,
        backing off to 5 s after 30 s; stop on `completed` or `failed`.
        Rate limit: `120/min/user`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Current analysis state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentStatusInfo'
              examples:
                success:
                  value:
                    data:
                      id: b2d4e6f8-1234-4abc-9def-0123456789ab
                      status: processing
                      progress: 65
                      current_step: crossref_validation
                      error: null
                      updated_at: "2026-09-23T15:31:05Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /documents/{document}/retry:
    post:
      tags: [Documents]
      operationId: retryDocument
      summary: Retry failed analysis
      description: |
        Re-runs the pipeline. Allowed **only** when `status = failed`; any other
        state returns `409 CONFLICT`. The previous run's derived rows are removed
        and the document is reset to `pending` / `queued`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '202':
          description: Analysis re-queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    required: [data, message]
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentStatusInfo'
              examples:
                success:
                  value:
                    data:
                      id: b2d4e6f8-1234-4abc-9def-0123456789ab
                      status: pending
                      progress: 0
                      current_step: queued
                      error: null
                      updated_at: "2026-09-23T15:35:00Z"
                    message: Analisis dijadwalkan ulang.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '409':
          $ref: '#/components/responses/ConflictDocumentRetry'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /documents/{document}/references:
    get:
      tags: [References]
      operationId: listReferences
      summary: List references
      description: |
        Paginated bibliography of one document, each item with its finding
        preview. Ordering is document position (`text_start_offset` ASC, nulls
        last, then `id`). The `status=pending` filter also matches references
        whose finding row does not exist yet.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          required: false
          description: Filter by reference finding status.
          schema:
            $ref: '#/components/schemas/ReferenceFindingStatus'
        - name: has_doi
          in: query
          required: false
          description: Filter by presence of a DOI. Accepts `true/false` and `1/0`.
          schema:
            oneOf:
              - type: boolean
              - type: string
                enum: ['true', 'false', '1', '0']
      responses:
        '200':
          description: Paginated reference list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReferenceSummary'
              examples:
                success:
                  value:
                    data:
                      - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                        raw_text: LeCun, Y., Bengio, Y., & Hinton, G. (2019). Deep learning. Nature.
                        doi: 10.1038/nature14539
                        title: Deep learning
                        authors: LeCun, Y., Bengio, Y., & Hinton, G.
                        publication_name: Nature
                        publication_year: 2019
                        text_start_offset: 8120
                        text_end_offset: 8295
                        finding:
                          id: 3c4d5e6f-7081-4c9d-ae1f-2a3b4c5d6e7f
                          status: valid
                          confidence: 0.95
                          reason: Exact DOI match with Crossref.
                          selected_candidate_id: 5e6f7081-92a3-4ebf-8a3b-4c5d6e7f8091
                    meta:
                      current_page: 1
                      per_page: 15
                      total: 8
                      last_page: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /references/{reference}:
    get:
      tags: [References]
      operationId: showReference
      summary: Reference detail
      description: |
        The bibliography entry plus its highlight locations, its finding with the
        ranked Crossref candidates, and the resolved citations pointing to it.
      parameters:
        - $ref: '#/components/parameters/ReferenceId'
      responses:
        '200':
          description: Reference detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReferenceDetail'
              examples:
                success:
                  value:
                    data:
                      id: 2b3c4d5e-6f70-4b8c-9d0e-1f2a3b4c5d6e
                      raw_text: Koten, D. B. (2023). Sistem Deteksi Plagiarisme. Jurnal Informatika.
                      doi: null
                      title: Sistem Deteksi Plagiarisme
                      authors: Koten, D. B.
                      publication_name: Jurnal Informatika
                      publication_year: 2023
                      text_start_offset: 8300
                      text_end_offset: 8390
                      locations:
                        - page_number: 12
                          x: 72.0
                          y: 210.4
                          width: 451.2
                          height: 24.0
                          page_width: 595.0
                          page_height: 842.0
                          coordinate_system: pdf_points_top_left
                          location_index: 0
                      finding:
                        id: 4d5e6f70-8192-4dae-bf2a-3b4c5d6e7f80
                        status: suspicious
                        confidence: 0.63
                        reason: Judul pada metadata Crossref memiliki perbedaan.
                        selected_candidate_id: 5e6f7081-92a3-4ebf-8a3b-4c5d6e7f8091
                        is_manual: false
                        reviewed_by: null
                        reviewed_at: null
                        candidates:
                          - id: 5e6f7081-92a3-4ebf-8a3b-4c5d6e7f8091
                            rank: 1
                            confidence: 0.63
                            doi: 10.1234/example
                            title: Sistem Pendeteksi Plagiarisme Dokumen
                            authors: Koten, D. B.
                            publication_name: Jurnal Informatika
                            publication_year: 2023
                            url: https://doi.org/10.1234/example
                            match_reason: "Author and year match; title similarity 0.78."
                      citations:
                        - id: 6f708192-a3b4-4f80-9b4c-5d6e7f8091a2
                          citation_text: "(Koten, 2023)"
                          occurrence_index: 4
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ReferenceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /references/{reference}/finding:
    patch:
      tags: [References]
      operationId: updateReferenceFinding
      summary: Manual review override
      description: |
        Changes the verdict and/or selects another candidate. Sets
        `is_manual = true` and stamps `reviewed_by` / `reviewed_at`. A review
        while the document is `processing` returns `409 CONFLICT`, so a running
        pipeline is never overwritten. A reference without a finding row gets a
        manual finding with `confidence: null`.
      parameters:
        - $ref: '#/components/parameters/ReferenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReferenceFindingRequest'
      responses:
        '200':
          description: Finding updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    required: [data, message]
                    properties:
                      data:
                        $ref: '#/components/schemas/ReferenceFindingReview'
              examples:
                success:
                  value:
                    data:
                      id: 4d5e6f70-8192-4dae-bf2a-3b4c5d6e7f80
                      status: valid
                      confidence: 0.63
                      reason: Diverifikasi manual oleh pengguna.
                      selected_candidate_id: 5e6f7081-92a3-4ebf-8a3b-4c5d6e7f8091
                      is_manual: true
                      reviewed_by: 9f1c2b3a-4d5e-4f60-8a91-2b3c4d5e6f70
                      reviewed_at: "2026-09-23T15:40:00Z"
                      updated_at: "2026-09-23T15:40:00Z"
                    message: Status referensi diperbarui.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ReferenceNotFound'
        '409':
          $ref: '#/components/responses/ConflictFindingReview'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /documents/{document}/citations:
    get:
      tags: [Citations]
      operationId: listCitations
      summary: List citations
      description: |
        Paginated in-text citation occurrences with the **derived** status
        (`valid | unreliable | pending | unresolved | hallucination`). Ordering is
        document position (`text_start_offset` ASC, nulls last, then `id`).
        `reference_id` must belong to the same document, otherwise `422` (a
        foreign or missing reference id is never disclosed).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          required: false
          description: Filter by derived citation status.
          schema:
